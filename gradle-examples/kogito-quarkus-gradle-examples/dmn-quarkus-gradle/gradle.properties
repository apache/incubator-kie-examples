quarkusPluginVersion=3.33.3.2
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.33.3.2
taskTreeVersion=4.0.1
junitVersion=5.12.1
kogitoVersion=999-SNAPSHOT